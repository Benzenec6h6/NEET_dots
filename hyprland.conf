# 初回起動の警告バナーを無効化
autogenerated = 0

# ディスプレイ設定 (自動認識)
monitor = , preferred, auto, 1

# VM環境向け: ハードウェアカーソルを無効化 (マウス消失防止)
cursor {
  no_hardware_cursors = true
}

# 修飾キー: Super
$mainMod = SUPER

# ターミナル起動 (Super + Enter)
bind = $mainMod, RETURN, exec, foot

# 終了 (Super + M)
bind = $mainMod, M, exit,
